name: Windows build and installer

on:
  workflow_dispatch:
    inputs:
      krita_tag:
        description: 'Krita tag'
        required: false
        default: 'v6.0.4'
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - '**.md'

permissions:
  contents: write

env:
  KRITA_ROOT: C:\krita-dev
  LLVM_MINGW: C:\deps\llvm-mingw-20251118-ucrt-x86_64
  NINJA_DIR: C:\deps\Ninja
  CMAKE_HOME: C:\deps\cmake-3.31.6-windows-x86_64
  KRITA_DEPS_BRANCH: transition.now/qt6
  KIT_URL: https://aka.doubaocdn.com/s/WqkxbDnv9Q
  KIT_SHA256: 048e4384ebd72e594d1c3f23a645989277a8b338f948a2abe8d561cfff343bce

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Disk headroom
        shell: pwsh
        run: |
          foreach ($d in @('C:','D:')) {
            $disk = Get-CimInstance Win32_LogicalDisk -Filter ("DeviceID='" + $d + "'")
            if ($disk) { "{0} free {1} GB / total {2} GB" -f $d, [math]::Round($disk.FreeSpace/1GB,1), [math]::Round($disk.Size/1GB,1) }
          }

      - name: Toolchain (llvm-mingw 20251118 / Ninja / CMake 3.31)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:/deps | Out-Null
          if (-not (Test-Path ($env:LLVM_MINGW + '/bin/clang++.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20251118/llvm-mingw-20251118-ucrt-x86_64.zip' -OutFile ($env:RUNNER_TEMP + '/llvm.zip')
            Expand-Archive ($env:RUNNER_TEMP + '/llvm.zip') -DestinationPath 'C:/deps' -Force
          }
          if (-not (Test-Path ($env:NINJA_DIR + '/ninja.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip' -OutFile ($env:RUNNER_TEMP + '/ninja.zip')
            New-Item -ItemType Directory -Force $env:NINJA_DIR | Out-Null
            Expand-Archive ($env:RUNNER_TEMP + '/ninja.zip') -DestinationPath $env:NINJA_DIR -Force
          }
          if (-not (Test-Path ($env:CMAKE_HOME + '/bin/cmake.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip' -OutFile ($env:RUNNER_TEMP + '/cmake.zip')
            Expand-Archive ($env:RUNNER_TEMP + '/cmake.zip') -DestinationPath 'C:/deps' -Force
          }
          ($env:CMAKE_HOME + '/bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:NINJA_DIR | Out-File -FilePath $env:GITHUB_PATH -Append
          & ($env:CMAKE_HOME + '/bin/cmake.exe') --version
          & ($env:NINJA_DIR + '/ninja.exe') --version

      - name: Port kit (repo copy or signed zip)
        shell: pwsh
        run: |
          if (Test-Path 'windows/scripts/03-build.ps1') { 'kit: already in repo'; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'kit.zip'
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            'download attempt ' + $i + ' via curl (max 60s)'
            & curl.exe -sSL --max-time 60 --retry 1 -o $zip $env:KIT_URL
            "curl exit: $LASTEXITCODE"
            if (Test-Path $zip) {
              $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              "sha256: $h"
              if ($h -eq $env:KIT_SHA256) { $ok = $true; break }
            }
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $ok) {
            'retrying with Invoke-WebRequest'
            try {
              Invoke-WebRequest -Uri $env:KIT_URL -OutFile $zip -TimeoutSec 45 -UseBasicParsing
              $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              if ($h -eq $env:KIT_SHA256) { $ok = $true }
            } catch { 'iwr failed: ' + $_.Exception.Message }
          }
          if (-not $ok) { throw 'port kit download failed (CDN unreachable or hash mismatch)' }
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          'kit: extracted and checksum verified'

      - name: Upstream assets and license
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/LanRhyme/ReveriePaint.git ($env:GITHUB_WORKSPACE + '/upstream')
          if ($LASTEXITCODE -ne 0) { throw 'clone upstream failed' }
          Copy-Item ($env:GITHUB_WORKSPACE + '/upstream/LICENSE') ($env:GITHUB_WORKSPACE + '/LICENSE') -Force

      - name: 01 bootstrap source and dependencies
        shell: pwsh
        run: |
          $tag = '${{ inputs.krita_tag }}'
          if (-not $tag) { $tag = 'v6.0.4' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/01-bootstrap-deps.ps1 -Root $env:KRITA_ROOT -KritaTag $tag -DepsBranch $env:KRITA_DEPS_BRANCH -LlvmMingw $env:LLVM_MINGW -NinjaDir $env:NINJA_DIR -PythonExe python
          if ($LASTEXITCODE -ne 0) { throw ('01 failed: ' + $LASTEXITCODE) }

      - name: 02 apply patches
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/02-apply-patches.ps1 -Root $env:KRITA_ROOT
          if ($LASTEXITCODE -ne 0) { throw ('02 failed: ' + $LASTEXITCODE) }

      - name: 03 build and install
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/03-build.ps1 -Root $env:KRITA_ROOT -Jobs 4 -Config Release
          if ($LASTEXITCODE -ne 0) {
            $log = $env:KRITA_ROOT + '/build.log'
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw ('03 failed: ' + $LASTEXITCODE)
          }

      - name: 04 stage portable package
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/04-stage-portable.ps1 -Root $env:KRITA_ROOT -LlvmMingw $env:LLVM_MINGW -AssetSource ($env:GITHUB_WORKSPACE + '/upstream/app/src/main/assets')
          if ($LASTEXITCODE -ne 0) { throw ('04 failed: ' + $LASTEXITCODE) }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force logs | Out-Null
          function Log([string]$m) { Write-Host $m; Add-Content -Path 'logs/installer-console.log' -Value $m -Encoding utf8 }
          $pkg = $env:KRITA_ROOT + '/dist/ReveriePaint'
          Log ('pkg dir exists: ' + (Test-Path $pkg) + '  -> ' + $pkg)
          $iss = Join-Path $env:GITHUB_WORKSPACE 'windows\installer\reveriepaint.iss'
          Log ('iss exists: ' + (Test-Path $iss))
          $txt = Get-Content $iss -Raw
          [System.IO.File]::WriteAllText($iss, $txt, (New-Object System.Text.UTF8Encoding($true)))
          Log 'iss rewritten as UTF-8 with BOM'
          $cands = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\Chocolatey\bin\ISCC.exe')
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Log 'no local ISCC, running: choco install innosetup -y'
            & choco install innosetup --no-progress -y 2>&1 | ForEach-Object { Log ([string]$_) }
            Log ('choco exit: ' + $LASTEXITCODE)
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            Log 'choco path failed, installing Inno Setup 6 directly from jrsoftware'
            $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            & curl.exe -sSL --max-time 180 -o $exe 'https://jrsoftware.org/download.php/is.exe'
            Log ('download exit: ' + $LASTEXITCODE + ' size: ' + (Get-Item $exe -ErrorAction SilentlyContinue).Length)
            Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) { $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          }
          if (-not $iscc) { Log 'ISCC.exe not found anywhere'; throw 'ISCC.exe not found' }
          Log ('using iscc: ' + $iscc)
          $islUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl'
          $langIsl = Join-Path (Split-Path $iscc) 'Languages\ChineseSimplified.isl'
          $localIsl = Join-Path $env:GITHUB_WORKSPACE 'windows\installer\ChineseSimplified.isl'
          $chineseOk = $false
          if (Test-Path $langIsl) { $chineseOk = $true; Log ('chinese isl present: ' + $langIsl) }
          if (-not $chineseOk) {
            Log ('chinese isl missing, downloading -> ' + $langIsl)
            & curl.exe -sSL --max-time 60 -o $langIsl $islUrl
            Log ('isl download exit: ' + $LASTEXITCODE + ' size: ' + ((Get-Item $langIsl -ErrorAction SilentlyContinue).Length))
            if (Test-Path $langIsl) { $chineseOk = $true }
          }
          if (-not $chineseOk) {
            & curl.exe -sSL --max-time 60 -o $localIsl $islUrl
            Log ('isl download (local) exit: ' + $LASTEXITCODE + ' size: ' + ((Get-Item $localIsl -ErrorAction SilentlyContinue).Length))
            if (Test-Path $localIsl) {
              $chineseOk = $true
              $t2 = (Get-Content $iss -Raw) -replace 'compiler:Languages\\ChineseSimplified.isl', 'ChineseSimplified.isl'
              [System.IO.File]::WriteAllText($iss, $t2, (New-Object System.Text.UTF8Encoding($true)))
              Log 'pointed iss at local chinese isl'
            }
          }
          if (-not $chineseOk) {
            Log 'chinese isl unavailable, switching installer to English-only'
            $t2 = (Get-Content $iss -Raw) -replace 'Name: "chinesesimplified"; MessagesFile: "compiler:Languages\\ChineseSimplified.isl"', '; chinese language removed: isl unavailable'
            [System.IO.File]::WriteAllText($iss, $t2, (New-Object System.Text.UTF8Encoding($true)))
          }
          & $iscc ('/DDistDir=' + $pkg) $iss 2>&1 | ForEach-Object { Log ([string]$_) }
          $rc = [int]$LASTEXITCODE
          Log ('iscc exit: ' + $rc)
          if ($rc -ne 0) { Get-Content 'logs/installer-console.log' -Tail 40; throw ('iscc failed: ' + $rc) }
          Get-ChildItem 'windows\out' -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String | ForEach-Object { Log $_ }

      - name: Publish failure log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          $out = @('# CI failure log', 'run: ' + $env:GITHUB_RUN_ID, '')
          if (Test-Path ($env:KRITA_ROOT + '/build-rc.txt')) { $out += '--- build-rc ---'; $out += (Get-Content ($env:KRITA_ROOT + '/build-rc.txt')) }
          $log = $env:KRITA_ROOT + '/build.log'
          if (Test-Path $log) { $out += '--- build.log tail 150 ---'; $out += (Get-Content $log -Tail 150) }
          if (Test-Path ($env:KRITA_ROOT + '/_install')) {
            $out += '--- _install 顶层 ---'
            $out += (Get-ChildItem ($env:KRITA_ROOT + '/_install') -Name | Select-Object -First 60)
          }
          $stlog = $env:KRITA_ROOT + '/dist/stage-console.log'
          if (Test-Path $stlog) { $out += '--- stage-console.log tail 120 ---'; $out += (Get-Content $stlog -Tail 120) }
          if (Test-Path 'logs/installer-console.log') { $out += '--- installer-console.log tail 150 ---'; $out += (Get-Content 'logs/installer-console.log' -Tail 150) }
          if (Test-Path 'windows/out') { $out += '--- windows/out ---'; $out += (Get-ChildItem 'windows/out' -Name) }
          $out | Set-Content 'logs/last-failure.txt' -Encoding UTF8
          git config user.email 'ci@users.noreply.github.com'
          git config user.name 'CI'
          git add logs/last-failure.txt
          git commit -m ('ci: failure log run ' + $env:GITHUB_RUN_ID)
          git push

      - name: Collect artifacts into workspace
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($p in @('C:\krita-dev\dist\*.zip','windows\out\*.exe','C:\krita-dev\build.log','C:\krita-dev\build-rc.txt','C:\krita-dev\dist\stage-console.log','logs\installer-console.log')) {
            Get-ChildItem $p -ErrorAction SilentlyContinue | Copy-Item -Destination artifacts -Force
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReveriePaint-Windows
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
