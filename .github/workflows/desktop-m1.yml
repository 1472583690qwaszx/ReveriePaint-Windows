name: Desktop M1 (engine compile)

# 专用于 M1：把 ReveriePaint v1.11.0 的原生引擎在 Windows 上做语法级编译验证。
# - 不重建整棵 Krita（只 configure），单轮约 15 分钟
# - 探针结果写入 logs/engine-probe.txt 并提交回仓库，供未登录场景读取
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-port/**'
      - 'windows/**'
      - '.github/workflows/desktop-m1.yml'

permissions:
  contents: write

env:
  KRITA_ROOT: C:/krita-dev
  UPSTREAM_TAG: v1.11.0
  LLVM_MINGW: C:/deps/llvm-mingw-20251118-ucrt-x86_64
  NINJA_DIR: C:/deps/Ninja
  CMAKE_HOME: C:/deps/cmake-3.31.6-windows-x86_64
  KRITA_DEPS_BRANCH: transition.now/qt6
  KIT_URL: https://aka.doubaocdn.com/s/n3IQw6uQ4V
  KIT_SHA256: 048e4384ebd72e594d1c3f23a645989277a8b338f948a2abe8d561cfff343bce

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: C:/deps
          key: deps-${{ runner.os }}-llvm20251118-cmake3316-ninja

      - name: Toolchain
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:/deps | Out-Null
          if (-not (Test-Path ($env:LLVM_MINGW + '/bin/clang++.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20251118/llvm-mingw-20251118-ucrt-x86_64.zip' -OutFile ($env:RUNNER_TEMP + '/llvm.zip')
            Expand-Archive ($env:RUNNER_TEMP + '/llvm.zip') -DestinationPath 'C:/deps' -Force
          }
          if (-not (Test-Path ($env:NINJA_DIR + '/ninja.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip' -OutFile ($env:RUNNER_TEMP + '/ninja.zip')
            New-Item -ItemType Directory -Force $env:NINJA_DIR | Out-Null
            Expand-Archive ($env:RUNNER_TEMP + '/ninja.zip') -DestinationPath $env:NINJA_DIR -Force
          }
          if (-not (Test-Path ($env:CMAKE_HOME + '/bin/cmake.exe'))) {
            Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip' -OutFile ($env:RUNNER_TEMP + '/cmake.zip')
            Expand-Archive ($env:RUNNER_TEMP + '/cmake.zip') -DestinationPath 'C:/deps' -Force
          }
          ($env:CMAKE_HOME + '/bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:NINJA_DIR | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Port kit (repo copy or signed zip)
        shell: pwsh
        run: |
          if (Test-Path 'windows/scripts/03-build.ps1') { 'kit: already in repo'; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'kit.zip'
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            'download attempt ' + $i
            & curl.exe -sSL --max-time 60 --retry 1 -o $zip $env:KIT_URL
            if (Test-Path $zip) {
              $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              if ($h -eq $env:KIT_SHA256) { $ok = $true; break }
            }
            Start-Sleep -Seconds (10 * $i)
          }
          if (-not $ok) { throw 'port kit unavailable' }
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          'kit: extracted'

      - name: Krita source and dependencies
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/01-bootstrap-deps.ps1 -Root $env:KRITA_ROOT -KritaTag v6.0.4 -DepsBranch $env:KRITA_DEPS_BRANCH -LlvmMingw $env:LLVM_MINGW -NinjaDir $env:NINJA_DIR -PythonExe python
          if ($LASTEXITCODE -ne 0) { throw ('01 failed: ' + $LASTEXITCODE) }

      - name: Apply patches
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/02-apply-patches.ps1 -Root $env:KRITA_ROOT
          if ($LASTEXITCODE -ne 0) { throw ('02 failed: ' + $LASTEXITCODE) }

      - name: Configure Krita (no build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'windows/scripts/lib/common.ps1')
          $build = 'C:/krita-dev/b_krita'
          New-Item -ItemType Directory -Force $build | Out-Null
          $llvm = ($env:LLVM_MINGW + '/bin')
          $args = @(
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_INSTALL_PREFIX=C:/krita-dev/_install',
            '-DBUILD_WITH_QT6=ON',
            '-DALLOW_UNSTABLE=QT6',
            '-DKRITA_ENABLE_PCH=OFF',
            '-DHIDE_SAFE_ASSERTS=OFF',
            '-DKRITA_USE_SURFACE_COLOR_MANAGEMENT_API=OFF',
            '-DBUILD_TESTING=OFF',
            ('-DCMAKE_C_COMPILER=' + $llvm + '/clang.exe'),
            ('-DCMAKE_CXX_COMPILER=' + $llvm + '/clang++.exe'),
            ('-DCMAKE_RC_COMPILER=' + $llvm + '/windres.exe'))
          $quoted = ($args -join ' ')
          $line = 'cmake "C:/krita-dev/krita" ' + $quoted
          $lines = @('cd /d ' + $build, $line, 'if errorlevel 1 exit /b 31')
          $rc = [int](Invoke-InKritaEnv -Root 'C:/krita-dev' -Lines $lines -LogPath 'C:/krita-dev/configure.log' -BatName 'reverie-configure.bat')
          'configure exit: ' + $rc
          if ($rc -ne 0) { Get-Content 'C:/krita-dev/configure.log' -Tail 40; throw ('configure failed: ' + $rc) }

      - name: Engine compile probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force logs | Out-Null
          $log = 'logs/engine-probe.txt'
          $rp = 'C:/rp'
          git clone --filter=blob:none --sparse --depth 1 --branch $env:UPSTREAM_TAG https://github.com/LanRhyme/ReveriePaint.git $rp
          if ($LASTEXITCODE -ne 0) { throw 'clone upstream failed' }
          git -C $rp sparse-checkout set app/src/main/cpp
          if ($LASTEXITCODE -ne 0) { throw 'sparse checkout failed' }
          $eng = Join-Path $rp 'app/src/main/cpp'
          $src = 'C:/krita-dev/krita'
          $build = 'C:/krita-dev/b_krita'
          $qt = 'C:/krita-dev/_install/include'
          $shim = Join-Path $env:GITHUB_WORKSPACE 'desktop-port/engine/include'
          $clang = Join-Path $env:LLVM_MINGW 'bin/clang++.exe'
          $incs = @(
            $shim,
            $src, (Join-Path $src 'libs'), (Join-Path $src 'libs/global'), (Join-Path $src 'libs/image'),
            (Join-Path $src 'libs/pigment'), (Join-Path $src 'libs/ui'), (Join-Path $src 'libs/flake'),
            (Join-Path $src 'libs/brush'), (Join-Path $src 'libs/color'), (Join-Path $src 'libs/command'),
            (Join-Path $src 'libs/impex'), (Join-Path $src 'libs/metadata'), (Join-Path $src 'libs/store'),
            (Join-Path $src 'libs/resources'), (Join-Path $src 'libs/psd'), (Join-Path $src 'libs/widgets'),
            (Join-Path $build 'libs'), (Join-Path $build 'libs/image'), (Join-Path $build 'libs/pigment'),
            $qt, (Join-Path $qt 'QtCore'), (Join-Path $qt 'QtGui'), (Join-Path $qt 'QtWidgets'), (Join-Path $qt 'QtConcurrent'),
            (Join-Path $env:JAVA_HOME 'include'), (Join-Path $env:JAVA_HOME 'include/win32'))
          $flags = @('-std=c++17', '-fsyntax-only', '-w', '-fms-extensions')
          foreach ($i in $incs) { if (Test-Path $i) { $flags += ('-I' + $i) } }
          $files = Get-ChildItem (Join-Path $eng '*.cpp') | Sort-Object Name
          $failed = 0
          $report = @()
          foreach ($f in $files) {
            $out = & $clang @flags $f.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed++
              $report += ('### ' + $f.Name)
              $report += (($out | Where-Object { $_ -match ': error ' } | Select-Object -First 3) | ForEach-Object { ([string]$_).Trim() })
            }
          }
          $summary = ('probe: ' + $failed + '/' + $files.Count + ' cpp files failed')
          Set-Content -Path $log -Value $summary -Encoding utf8
          $summary
          $report | Select-Object -First 400 | Out-File -FilePath $log -Append -Encoding utf8
          $report | Select-Object -First 60

      - name: Publish probe report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          if (-not (Test-Path 'logs/engine-probe.txt')) {
            Set-Content 'logs/engine-probe.txt' -Value 'probe log missing' -Encoding utf8
          }
          git config user.email 'ci@users.noreply.github.com'
          git config user.name 'CI'
          git add logs/engine-probe.txt
          git commit -m 'ci: engine probe report'
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-probe
          path: |
            logs/engine-probe.txt
            C:/krita-dev/configure.log
          if-no-files-found: warn
          retention-days: 14
